# Exam Aim — static site for __DOMAIN__ (added by deploy/install.sh)
server {
    listen 80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/exam-aim.access.log;
    error_log  /var/log/nginx/exam-aim.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Always fetch fresh: service worker and exam data
    location = /sw.js   { add_header Cache-Control "no-cache"; }
    location /data/     { add_header Cache-Control "no-cache"; }
    location /assets/   { add_header Cache-Control "public, max-age=3600"; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
