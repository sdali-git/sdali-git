name: Update exams & deploy site

on:
  schedule:
    # GitHub cron runs in UTC. 19:30 UTC Sun/Tue/Thu = 1:00 AM IST Mon/Wed/Fri.
    - cron: '30 19 * * 0,2,4'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install headless Chromium (for JavaScript-only official sites)
        if: github.event_name != 'push'
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fetch latest exam updates from official sources
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "exam-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/status.json
          if git diff --cached --quiet; then
            echo "No new updates."
          else
            git commit -m "Update exam notifications $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
